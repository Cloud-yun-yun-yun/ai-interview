#建议自己在本地环境打包jar包，必须命名为app.jar，
#建议自己下载jdk21的linux版本，放到opt/java目录下
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-interview-postgres
    restart: unless-stopped
    networks:
      - ai-interview-network
    environment:
      # 时区
      TZ: Asia/Shanghai
      # 超级用户 & 密码
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      # 默认数据库（与 application.yaml 中的 jdbc url 末尾一致）
      POSTGRES_DB: interview
    ports:
      # 宿主机 5432 -> 容器 5432（虚拟机无端口冲突，直接用 5432）
      - "5432:5432"
    volumes:
      # 数据目录：/root/project/ai-interview/postgresql/data
      - /root/project/ai-interview/postgresql/data:/var/lib/postgresql/data
      # 初始化脚本：/root/project/ai-interview/postgresql/init（与 data 平级）
      # 注意：初始化脚本只在“空数据目录”首次启动时执行一次
      - /root/project/ai-interview/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: unless-stopped
    networks:
      - ai-interview-network
    environment:
      # 时区
      TZ: Asia/Shanghai
    # 不设置密码（redis-cli ping 即可通过 healthcheck）
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 宿主机 6379 -> 容器 6379（虚拟机无端口冲突，直接用 6379）
      - "6379:6379"
    volumes:
      # 数据目录：/root/project/ai-interview/redis/data
      - /root/project/ai-interview/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:latest
    container_name: ai-interview-minio
    restart: unless-stopped
    networks:
      - ai-interview-network
    environment:
      # 时区
      TZ: Asia/Shanghai
      # 访问密钥 & 密钥（从宿主机环境变量 / .env 文件读取，对应 docker run 的 -e MINIO_ROOT_USER / -e MINIO_ROOT_PASSWORD）
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      # S3 API：宿主机 9000 -> 容器 9000
      - "9000:9000"
      # Web 控制台：宿主机 9001 -> 容器 9001
      - "9001:9001"
    volumes:
      # 数据目录：/root/project/ai-interview/minio/data
      - /root/project/ai-interview/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-interview-backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-interview-backend:latest
    container_name: ai-interview-backend
    restart: unless-stopped
    networks:
      - ai-interview-network
    environment:
      # 时区
      TZ: Asia/Shanghai
      # 激活部署环境 Profile（加载 application-prod.yaml，连接 postgres/redis/minio）
      SPRING_PROFILES_ACTIVE: prod
      # 大模型 API Key（从 .env / 宿主机环境变量注入）
      ALIYUN_APIKEY: ${ALIYUN_APIKEY}
      # MinIO 访问密钥 & 密钥（对应 application.yaml 中 ${MINIO_ACCESSKEY} / ${MINIO_SECRETKEY}）
      MINIO_ACCESSKEY: ${MINIO_ACCESSKEY}
      MINIO_SECRETKEY: ${MINIO_SECRETKEY}
    ports:
      # 宿主机 8080 -> 容器 8080
      - "8080:8080"
    volumes:
      - /opt/java:/opt/java:ro
      - ./app.jar:/app/app.jar
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-interview-frontend:
    image: nginx:stable-alpine
    container_name: ai-interview-frontend
    restart: unless-stopped
    networks:
      - ai-interview-network
    ports:
      # 宿主机 80 -> 容器 80
      - "80:80"
    volumes:
      # 前端静态资源：/root/project/ai-interview/nginx/html（放置 npm run build 产物）
      - /root/project/ai-interview/nginx/html:/usr/share/nginx/html
      # nginx 配置：建议将宿主机上的配置文件命名为 default.conf
      - /root/project/ai-interview/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ai-interview-backend

networks:
  # 通用网络：所有服务（postgres/redis/minio/backend/frontend）共用
  ai-interview-network:
    name: ai-interview-network
    driver: bridge