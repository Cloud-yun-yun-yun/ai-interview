# 部署环境配置：连接 docker-compose 中的服务（postgres/redis/minio）
# 激活方式：-Dspring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod
# 公共配置（大模型、voice、mybatis、minio Access/Secret Key 等）继承自 application.yaml，Key 依旧从系统环境变量读取
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/interview
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379

#部署环境 MinIO endpoint（Access/Secret Key 等通用配置在 application.yaml 中）
minio:
  storage:
    endpoint: http://192.168.100.129:9000  #一定要使用宿主机的IP地址