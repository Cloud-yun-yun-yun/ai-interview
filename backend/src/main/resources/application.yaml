spring:
  application:
    name: ai-interview
  datasource:
    url: jdbc:postgresql://localhost:5433/interview
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6380

  ai:
    openai:
      api-key: sk-ws-H.PMMYIIP.tjtk.MEYCIQD62POBJr9t7DsUeTRLHkTHKgzSEAtyhnW9AMxo7-QDTAIhAKWAe2K5-pEIGppa2SsLDWGBnNkTbb7rLDeEbN6To6Uz
      base-url: https://ws-snlscsj5heo4kuyy.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.8-flash
          temperature: 0.8
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          dimensions: 1024
    #向量数据库
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: false
    # JDBC 聊天记忆自动建表（PostgreSQL 需用 never）
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

#voice.interview 语音合成(TTS) 与识别(ASR) 配置
voice:
  interview:
    api-key: sk-ws-H.PMMYIIP.tjtk.MEYCIQD62POBJr9t7DsUeTRLHkTHKgzSEAtyhnW9AMxo7-QDTAIhAKWAe2K5-pEIGppa2SsLDWGBnNkTbb7rLDeEbN6To6Uz
    tts:
      base-url: https://ws-snlscsj5heo4kuyy.cn-beijing.maas.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer
      model: qwen-audio-3.1-tts-next
      format: mp3
      sample-rate: 48000
    asr:
      base-url: https://maas.qianwenaiapi.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-audio-3.1-asr-flash
      format: mp3
      # mp3 内嵌采样率，可不传 sample-rate；如需兜底非 mp3（如 wav/pcm）再按需传
      sample-rate: 16000
