# 主配置：存放公共配置（与运行环境无关）
# 默认 Profile 为 dev：本地直接启动即走开发环境（application-dev.yaml）
# 部署时 docker-compose 显式设置 SPRING_PROFILES_ACTIVE=prod，会覆盖默认值生效（application-prod.yaml）
spring:
  profiles:
    default: dev
  application:
    name: ai-interview

  ai:
    openai:
      api-key: ${ALIYUN_APIKEY}
      base-url: https://ws-snlscsj5heo4kuyy.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.8-flash
          temperature: 0.8
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          dimensions: 1024
    #向量数据库
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: false
    # JDBC 聊天记忆自动建表（PostgreSQL 需用 never）
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

voice:
  interview:
    api-key: ${ALIYUN_APIKEY}
    tts:
      # DashScope SDK base host（Constants.baseHttpApiUrl）
      base-url: https://maas.qianwenaiapi.com/api/v1
      model: qwen-audio-3.1-tts-flash
      voice: longanhuan_v3.1
      format: wav
      sample-rate: 24000
    asr:
      base-url: https://maas.qianwenaiapi.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-audio-3.1-asr-flash
      format: mp3
      # mp3 内嵌采样率，可不传 sample-rate；如需兜底非 mp3（如 wav/pcm）再按需传
      sample-rate: 16000
#minio通用配置（endpoint 在 dev/prod Profile 中按环境指定；Access/Secret Key 从系统环境变量读取）
minio:
  storage:
    access-key: ${MINIO_ACCESSKEY}
    secret-key: ${MINIO_SECRETKEY}
    bucket: ai-interview
    region: us-east-1
    auto-create-bucket: true