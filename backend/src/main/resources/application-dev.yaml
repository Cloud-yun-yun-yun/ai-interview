# 开发环境配置：连接本机 localhost 的 PostgreSQL / Redis / MinIO
# 激活方式：-Dspring.profiles.active=dev 或环境变量 SPRING_PROFILES_ACTIVE=dev
# 公共配置（大模型、voice、mybatis、minio Access/Secret Key 等）继承自 application.yaml，Key 依旧从系统环境变量读取
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/interview
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6380

#开发环境 MinIO endpoint（Access/Secret Key 等通用配置在 application.yaml 中）
minio:
  storage:
    endpoint: http://localhost:9000